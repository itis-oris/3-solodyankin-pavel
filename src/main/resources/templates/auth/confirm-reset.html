<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Подтверждение сброса</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<header>
    <button onclick="location.href='/electron/home'">На главную</button>
    <button onclick="location.href='/electron/auth/login'">Вернуться</button>
    <h1>Подтвердить сброс пароля</h1>
</header>
<body>
    <form th:action="@{/electron/auth/password-reset/confirm}" method="post" th:object="${confirmResetRequest}">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/><br/>

        <label>Код подтверждения:</label>
        <input type="text" th:field="*{code}" required/><br/>

        <label>Новый пароль:</label>
        <input type="password" th:field="*{newPassword}" required/><br/>

        <button type="submit">Сменить пароль</button>

        <div th:if="${error}" th:text="${error}" style="color:red;"></div>
        <div th:if="${success}" th:text="${success}" style="color:green;"></div>
    </form>
    <footer>
        <p>&copy; 2025 Спортивный комплекс "Электрон". Все права защищены.</p>
    </footer>
</body>
</html>
