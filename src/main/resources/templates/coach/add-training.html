<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Добавить тренировку</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <div>
        <button onclick="location.href='/electron/coach/trainings'">Назад</button>
        <button onclick="location.href='/electron/coach/home'">На домашнюю</button>
        <button onclick="logout()">Выйти</button>
    </div>
    <h1>Добавление тренировки</h1>
</header>

<main class="container">
    <section>
        <form th:action="@{/electron/coach/trainings/add}" method="post" onsubmit="return validateCheckboxSelection('groupIds');">
            <div class="form-group">
                <h1>Группы</h1>
                <div class="checkbox-group">
                    <div class="athletes-list" th:each="group : ${groups}">
                        <label>
                            <input type="checkbox" name="groupIds" th:value="${group.id}" />
                            <span th:text="${group.groupName}">Название группы</span>
                        </label><br />
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="day">День недели:</label>
                <select id="day" name="day" required>
                    <option value="" disabled selected>Выберите день недели</option>
                    <option>Понедельник</option>
                    <option>Вторник</option>
                    <option>Среда</option>
                    <option>Четверг</option>
                    <option>Пятница</option>
                    <option>Суббота</option>
                    <option>Воскресенье</option>
                </select>

            </div>

            <div class="form-group">
                <label for="time">Время:</label>
                <select id="time" name="time" required>
                    <option value="" disabled selected>Выберите время</option>
                    <option>08:00</option>
                    <option>08:30</option>
                    <option>09:00</option>
                    <option>09:30</option>
                    <option>10:00</option>
                    <option>10:30</option>
                    <option>11:00</option>
                    <option>11:30</option>
                    <option>12:00</option>
                    <option>12:30</option>
                    <option>13:00</option>
                    <option>13:30</option>
                    <option>14:00</option>
                    <option>14:30</option>
                    <option>15:00</option>
                    <option>15:30</option>
                    <option>16:00</option>
                    <option>16:30</option>
                    <option>17:00</option>
                    <option>17:30</option>
                    <option>18:00</option>
                    <option>18:30</option>
                    <option>19:00</option>
                    <option>19:30</option>
                    <option>20:00</option>
                </select>
            </div>

            <div class="form-group">
                <input type="hidden" name="groupId" th:value="${groupId}" />
                <button type="submit">Добавить тренировку</button>
            </div>

        </form>
    </section>
</main>

<div th:if="${error}" th:text="${error}" style="color:red;"></div>
<div th:if="${success}" th:text="${success}" style="color:green;"></div>

<footer>
    <p>&copy; 2025 Спортивный комплекс "Электрон". Все права защищены.</p>
</footer>

<script th:src="@{/js/coach.js}"></script>
<script th:src="@{/js/login.js}"></script>

</body>
</html>
